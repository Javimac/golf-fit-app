<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Golf Fit PWA</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="app-container">
        
        <!-- PANTALLA SPLASH -->
        <section id="splash-view" class="view active">
            <div class="splash-content">
                <h1 class="logo-text">Golf Fit</h1>
                <p class="tagline">Mejora tu swing</p>
                <div class="loader"></div>
            </div>
        </section>

        <!-- MENÚ PRINCIPAL -->
        <section id="menu-view" class="view hidden">
            <header>
                <h1>Menú Principal</h1>
            </header>
            <div class="menu-grid">
                <button id="btn-menu-warmup" class="menu-card">
                    <h2>Calentamiento</h2>
                    <p>Tee del 1 (10 min)</p>
                </button>
                <button id="btn-menu-mobility" class="menu-card">
                    <h2>Movilidad</h2>
                    <p>Cadera y Columna</p>
                </button>
                <button id="btn-menu-training" class="menu-card disabled">
                    <h2>Fuerza y Core</h2>
                    <p>Próximamente...</p>
                </button>
                <button id="btn-menu-metronome" class="menu-card metronome-card">
                    <h2>Metrónomo</h2>
                    <p>Práctica de Putter</p>
                </button>
            </div>
        </section>

        <!-- PANTALLA ENTRENAMIENTO -->
        <section id="workout-view" class="view hidden">
            <header class="nav-header">
                <button class="back-btn" onclick="showView('menu-view')">⬅ Volver</button>
                <h1 id="workout-title">Calentamiento</h1>
            </header>
            
            <div class="video-container">
                <!-- Contenedor de la Animación CSS/SVG -->
                <div id="css-animator" class="hidden">
                    <svg viewBox="0 0 100 100" class="stickman-svg">
                        <!-- Piernas estáticas -->
                        <path d="M 35 90 L 50 55 L 65 90" stroke="#555" stroke-width="4" fill="none" stroke-linecap="round"/>
                        <!-- Cabeza -->
                        <circle cx="50" cy="20" r="8" fill="#4CAF50"/>
                        <!-- Cuerpo y Brazos (Grupo Animado) -->
                        <g id="animated-torso">
                            <!-- Tronco -->
                            <line x1="50" y1="28" x2="50" y2="55" stroke="#4CAF50" stroke-width="5" stroke-linecap="round"/>
                            <!-- Brazos -->
                            <path d="M 50 35 L 25 45 M 50 35 L 75 45" stroke="#4CAF50" stroke-width="4" fill="none" stroke-linecap="round"/>
                            <!-- Palo de Golf Horizontal -->
                            <line x1="10" y1="45" x2="90" y2="45" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
                        </g>
                    </svg>
                </div>
                
                <div id="video-placeholder" class="placeholder-box">
                    <span id="video-name">Preparado</span>
                </div>
            </div>

            <div class="timer-display">
                <h2 id="exercise-name">Toca Empezar</h2>
                <div id="time-left">00:00</div>
                <p id="next-exercise" class="next-text">Siguiente: Movilidad Torácica</p>
            </div>

            <div class="controls">
                <button id="btn-prev" class="control-btn">Ant.</button>
                <button id="btn-play-pause" class="control-btn play-btn">Empezar</button>
                <button id="btn-next" class="control-btn">Sig.</button>
            </div>
        </section>

        <!-- PANTALLA METRÓNOMO -->
        <section id="metronome-view" class="view hidden">
            <header class="nav-header">
                <button class="back-btn" onclick="showView('menu-view')">⬅ Volver</button>
                <h1>Metrónomo Putter</h1>
            </header>
            
            <div class="metronome-display">
                <div id="bpm-display">80</div>
                <p>BPM (Beats per minute)</p>
            </div>

            <div class="slider-container">
                <input type="range" id="bpm-slider" min="40" max="120" value="80">
            </div>

            <div class="controls mt-extra">
                <button id="btn-metro-play" class="control-btn play-btn">Iniciar Metrónomo</button>
            </div>
            
            <p style="text-align:center; color:#888; font-size:0.8rem; margin-top:15px;">
                *Si no escuchas nada, comprueba que el móvil no esté en silencio.
            </p>
        </section>

    </div>
    <script src="app.js"></script>
</body>
</html>
