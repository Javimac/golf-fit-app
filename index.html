<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Golf Fit PWA</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="app-container">
        
        <!-- PANTALLA SPLASH -->
        <section id="splash-view" class="view active">
            <div class="splash-content">
                <h1 class="logo-text">Golf Fit</h1>
                <p class="tagline">Mejora tu swing</p>
                <div class="loader"></div>
            </div>
        </section>

        <!-- MENÚ PRINCIPAL -->
        <section id="menu-view" class="view hidden">
            <header>
                <h1>Menú Principal</h1>
            </header>
            <div class="menu-grid">
                <button id="btn-menu-warmup" class="menu-card">
                    <h2>Calentamiento</h2>
                    <p>Tee del 1 (Corto)</p>
                </button>
                <button id="btn-menu-mobility" class="menu-card">
                    <h2>Movilidad</h2>
                    <p>20 Ejercicios (Personalizable)</p>
                </button>
                <button id="btn-menu-training" class="menu-card disabled">
                    <h2>Fuerza y Core</h2>
                    <p>Próximamente...</p>
                </button>
                <button id="btn-menu-metronome" class="menu-card metronome-card">
                    <h2>Metrónomo</h2>
                    <p>Práctica de Putter</p>
                </button>
            </div>
        </section>

        <!-- PANTALLA SELECCIÓN DE EJERCICIOS -->
        <section id="selection-view" class="view hidden">
            <header class="nav-header">
                <button class="back-btn" onclick="showView('menu-view')">⬅ Volver</button>
                <h1>Elige tu Rutina</h1>
            </header>
            
            <div class="selection-actions">
                <button id="btn-select-all" class="secondary-btn">Deseleccionar Todos</button>
            </div>
            
            <div id="selection-list" class="selection-list">
                <!-- Se inyectan los 20 ejercicios desde JS -->
            </div>
            
            <div class="selection-footer">
                <div class="total-time-display">Tiempo: <span id="time-calc">00:00</span></div>
                <button id="btn-start-selected" class="control-btn play-btn">Comenzar</button>
            </div>
        </section>

        <!-- PANTALLA ENTRENAMIENTO -->
        <section id="workout-view" class="view hidden">
            <header class="nav-header">
                <button class="back-btn" onclick="showView('menu-view')">⬅ Volver</button>
                <h1 id="workout-title">Rutina Activa</h1>
            </header>
            
            <div class="video-container">
                <div id="youtube-container" class="hidden" style="width: 100%; height: 100%;">
                    <iframe id="youtube-player" width="100%" height="100%" src="" frameborder="0" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="border-radius: 12px;"></iframe>
                </div>
                <a id="youtube-fallback-btn" href="#" target="_blank" class="hidden fallback-link">
                    ▶ Ver vídeo en YouTube
                </a>
                <div id="video-placeholder" class="placeholder-box">
                    <span id="video-name">Preparado</span>
                </div>
            </div>

            <div class="timer-display">
                <h2 id="exercise-name">Toca Empezar</h2>
                <p id="exercise-desc" class="exercise-description">Beneficio del ejercicio...</p>
                <div id="time-left">00:00</div>
                <p id="next-exercise" class="next-text">Siguiente: ---</p>
            </div>

            <div class="controls">
                <button id="btn-prev" class="control-btn">Ant.</button>
                <button id="btn-play-pause" class="control-btn play-btn">Empezar</button>
                <button id="btn-next" class="control-btn">Sig.</button>
            </div>
        </section>

        <!-- PANTALLA METRÓNOMO -->
        <section id="metronome-view" class="view hidden">
            <header class="nav-header">
                <button class="back-btn" onclick="showView('menu-view')">⬅ Volver</button>
                <h1>Metrónomo Putter</h1>
            </header>
            
            <div class="metronome-display">
                <div class="metronome-visual">
                    <svg viewBox="0 0 100 100" class="metro-svg">
                        <path d="M 30 90 L 70 90 L 60 10 L 40 10 Z" fill="#2a2a2a" stroke="#444" stroke-width="2"/>
                        <line x1="50" y1="80" x2="50" y2="20" stroke="#555" stroke-width="2"/>
                        <g id="pendulum">
                            <line x1="50" y1="80" x2="50" y2="15" stroke="#2196F3" stroke-width="4" stroke-linecap="round"/>
                            <circle cx="50" cy="35" r="7" fill="#ff9800"/>
                        </g>
                        <circle cx="50" cy="80" r="6" fill="#fff"/>
                    </svg>
                </div>
                
                <div id="bpm-display">76</div>
                <p>BPM (Estándar PGA Tour)</p>
            </div>

            <!-- Botones de Ritmo de Profesionales -->
            <div class="pro-tempo-container">
                <p class="pro-label">Tempos Tour Pro:</p>
                <div class="pro-buttons-grid">
                    <button class="pro-btn" data-bpm="72">Estándar 72</button>
                    <button class="pro-btn active-pro" data-bpm="76">Media Tour (76)</button>
                    <button class="pro-btn" data-bpm="80">Rápido 80</button>
                </div>
            </div>

            <div class="slider-container">
                <input type="range" id="bpm-slider" min="40" max="120" value="76">
            </div>

            <div class="controls mt-extra">
                <button id="btn-metro-play" class="control-btn play-btn">Iniciar Metrónomo</button>
            </div>
        </section>

    </div>
    <script src="app.js"></script>
</body>
</html>
